
<!DOCTYPE html>
<html lang="tg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#ff6900">
<title>SAVDO TJ — Бозори Тоҷикистон</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
:root{
--orange:#ff6900;
--dark:#192133;
--gray:#87909f;
--bg:#f5f6fa;
--line:#e8eaf0;
}
body{
margin:0;
font-family:Arial,sans-serif;
background:var(--bg);
color:var(--dark);
}
button,input,select,textarea{font:inherit}
button{
border:0;
background:var(--orange);
color:white;
padding:13px 18px;
border-radius:12px;
font-weight:700;
cursor:pointer;
}
button:hover{filter:brightness(.95)}
button:disabled{opacity:.5}
.gray{background:#edf0f5;color:var(--dark)}
.red{background:#dc2626}
.green{background:#16a34a}
.full{width:100%}
.hidden,[hidden]{display:none!important}
header{
background:white;
position:sticky;
top:0;
z-index:20;
border-bottom:1px solid var(--line);
}
.top{
max-width:1400px;
margin:auto;
display:flex;
align-items:center;
gap:12px;
padding:18px 24px;
}
.logo{
font-size:33px;
font-weight:900;
letter-spacing:-2px;
color:var(--orange);
margin-right:auto;
cursor:pointer;
}
.logo span{color:var(--dark)}
main{
max-width:1400px;
margin:auto;
padding:24px 24px 110px;
}
.hero{
background:linear-gradient(115deg,#ff6900,#ff9c38);
border-radius:25px;
padding:38px;
color:white;
margin-bottom:25px;
}
.hero h1{
font-size:36px;
margin:0 0 12px;
}
.hero p{line-height:1.5}
.search{
display:flex;
gap:8px;
background:white;
padding:7px;
border-radius:15px;
margin-top:22px;
max-width:900px;
}
.search input{
margin:0;
border:0;
flex:1;
min-width:0;
}
input,select,textarea{
width:100%;
padding:13px;
border:1px solid #dfe3eb;
border-radius:11px;
background:white;
color:var(--dark);
margin:8px 0 14px;
outline:none;
}
input:focus,textarea:focus,select:focus{
border-color:var(--orange);
box-shadow:0 0 0 3px #ff690015;
}
textarea{min-height:110px}
label{font-weight:700;font-size:14px}
h2{font-size:24px}
.categories{
display:grid;
grid-template-columns:repeat(8,minmax(0,1fr));
gap:12px;
margin-bottom:25px;
}
.category{
background:white;
color:var(--dark);
border:1px solid var(--line);
border-radius:17px;
padding:17px 5px;
text-align:center;
cursor:pointer;
font-size:13px;
font-weight:700;
}
.category span{
display:grid;
place-items:center;
width:58px;
height:58px;
margin:0 auto 10px;
background:#fff0e3;
border-radius:18px;
font-size:32px;
}
.category.active{
border-color:var(--orange);
background:#fff5ed;
color:var(--orange);
}
.filters,.extraGrid{
display:grid;
grid-template-columns:repeat(4,minmax(0,1fr));
gap:10px;
}
.filters{
padding:12px;
background:white;
border-radius:15px;
}
.filters input,.filters select{margin:0}
.extraFields{
background:white;
border:1px solid var(--line);
border-radius:18px;
padding:18px;
margin:15px 0;
}
.extraFields h3{color:var(--orange)}
.extraDetails{
display:grid;
grid-template-columns:repeat(2,minmax(0,1fr));
gap:10px;
}
.extraDetail{
background:#f5f6fa;
padding:12px;
border-radius:10px;
overflow-wrap:anywhere;
}
.extraDetail strong{display:block;margin-top:5px}
.products{
display:grid;
grid-template-columns:repeat(4,minmax(0,1fr));
gap:18px;
}
.product{
background:white;
border:1px solid var(--line);
border-radius:18px;
overflow:hidden;
position:relative;
cursor:pointer;
transition:.2s;
}
.product:hover{
transform:translateY(-4px);
box-shadow:0 8px 24px #19213312;
}
.product img{
width:100%;
height:235px;
object-fit:cover;
display:block;
background:#eee;
}
.placeholder{
height:235px;
display:grid;
place-items:center;
background:#eee;
font-size:60px;
}
.info{padding:15px}
.info h3{
font-size:16px;
margin:10px 0;
overflow-wrap:anywhere;
}
.price{
color:var(--orange);
font-size:23px;
font-weight:900;
}
small{color:var(--gray)}
.heart{
position:absolute;
top:10px;
right:10px;
background:white;
color:var(--orange);
width:42px;
height:42px;
padding:0;
border-radius:50%;
font-size:25px;
box-shadow:0 2px 10px #0002;
}
.card{
background:white;
border:1px solid var(--line);
border-radius:20px;
padding:22px;
margin-bottom:15px;
}
.formCard{max-width:720px;margin:0 auto 18px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1}
.upload{
display:block;
border:2px dashed #ffb67f;
background:#fff7ef;
padding:25px 15px;
text-align:center;
border-radius:16px;
color:var(--orange);
cursor:pointer;
margin-bottom:12px;
}
.upload strong{display:block;margin:8px 0}
.upload input{display:none}
.preview{
display:grid;
grid-template-columns:repeat(4,minmax(0,1fr));
gap:9px;
margin:15px 0;
}
.previewItem{position:relative}
.preview img{
width:100%;
height:110px;
object-fit:cover;
border-radius:10px;
}
.removePhoto{
position:absolute;
right:5px;
top:5px;
background:#dc2626;
padding:6px 9px;
border-radius:50%;
}
.notice{
padding:15px;
background:#fff0df;
color:#a84c00;
border-radius:12px;
margin-bottom:15px;
overflow-wrap:anywhere;
}
.notice:empty{display:none}
.empty{
grid-column:1/-1;
background:white;
border-radius:18px;
text-align:center;
padding:45px 15px;
color:var(--gray);
}
dialog{
border:0;
border-radius:24px;
padding:22px;
width:95%;
max-width:760px;
max-height:90vh;
overflow:auto;
}
dialog::backdrop{background:#0009;backdrop-filter:blur(3px)}
.close{float:right;background:#eee;color:var(--dark)}
.detailPhoto{
width:100%;
height:400px;
object-fit:contain;
background:#f5f6fa;
border-radius:16px;
}
.thumbs{display:flex;gap:8px;overflow:auto;margin:10px 0}
.thumbs img{
width:75px;
height:75px;
object-fit:cover;
border-radius:10px;
cursor:pointer;
}
.chatMessage{
max-width:85%;
padding:13px;
background:#edf0f5;
border-radius:14px;
margin:9px 0;
white-space:pre-wrap;
overflow-wrap:anywhere;
}
.mine{margin-left:auto;background:#ffe5cf}
#messageList{max-height:450px;overflow:auto}
nav{
position:fixed;
bottom:0;
left:0;
right:0;
display:flex;
justify-content:space-around;
background:white;
border-top:1px solid var(--line);
padding:10px 5px;
padding-bottom:calc(10px + env(safe-area-inset-bottom));
z-index:30;
}
nav button{
background:white;
color:#687385;
font-size:11px;
padding:5px;
}
nav span{display:block;font-size:24px;margin-bottom:4px}
nav button.active{color:var(--orange)}
footer{text-align:center;color:var(--gray);padding:30px 10px}
#bannerBox{
overflow:hidden;
border-radius:22px;
margin-bottom:25px;
background:white;
}
.banner{position:relative}
.banner img{
width:100%;
height:310px;
object-fit:cover;
display:block;
}
.bannerText{
position:absolute;
bottom:0;
left:0;
right:0;
padding:22px;
color:white;
background:linear-gradient(transparent,#000d);
}
.bannerText h2{margin:8px 0}
.bannerText a{
display:inline-block;
background:var(--orange);
color:white;
padding:10px 16px;
border-radius:10px;
text-decoration:none;
}
.bannerLabel{
position:absolute;
top:12px;
left:12px;
background:#0009;
color:white;
padding:6px 12px;
border-radius:8px;
font-size:11px;
}
.bannerDots{
display:flex;
justify-content:center;
gap:8px;
padding:10px;
}
.bannerDot{
width:10px;
height:10px;
border-radius:50%;
padding:0;
background:#ddd;
}
.bannerDot.active{background:var(--orange)}
@media(min-width:1000px){
nav{
width:650px;
left:50%;
right:auto;
transform:translateX(-50%);
border-radius:20px 20px 0 0;
box-shadow:0 -5px 25px #0001;
}
}
@media(max-width:1000px){
.categories{grid-template-columns:repeat(4,minmax(0,1fr))}
.products{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media(max-width:650px){
.top{padding:12px;gap:8px}
.logo{font-size:26px}
.top button{padding:10px}
main{padding:14px 12px 100px}
.hero{padding:24px 18px;border-radius:20px}
.hero h1{font-size:26px}
.hero p{font-size:14px}
.categories{gap:7px}
.category{font-size:11px;padding:12px 3px}
.category span{width:46px;height:46px;font-size:27px}
.products{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.product img,.placeholder{height:170px}
.product{border-radius:14px}
.info{padding:12px}
.info h3{font-size:14px}
.price{font-size:19px}
.filters,.extraGrid{grid-template-columns:repeat(2,minmax(0,1fr))}
.filters input,.filters select{font-size:13px;padding:10px}
.detailPhoto{height:270px}
.card{padding:17px}
.preview{grid-template-columns:repeat(3,minmax(0,1fr))}
.banner img{height:220px}
.bannerText{padding:15px}
.bannerText h2{font-size:19px}
.bannerText p{font-size:12px}
h2{font-size:21px}
}
</style>
</head>

<body>

<header>
<div class="top">
<div class="logo" onclick="goHome()">SAVDO<span>TJ</span></div>

</div>

<script>

// SUPABASE

const db=supabase.createClient(
"https://hxisbrjwhnjprmlztxqb.supabase.co",
"sb_publishable_P5V4lNjdiqYoDm-2QDPZZg_yIufHvL6"
);

const $=id=>document.getElementById(id);

const REDIRECT="https://vayo665.github.io/SAVDO-TJ/";

let user=null;
let ads=[];
let favorites=new Set();
let selectedCategory="";
let favoriteMode=false;
let selectedFiles=[];
let oldImages=[];

let offset=0;
let listVersion=0;
let publishing=false;
let recoveryMode=false;
let recoveryUser=null;
let chatAd=null;
let chatUser=null;
let chatTimer=null;
let banners=[];
let bannerIndex=0;
let bannerTimer=null;

const categories=[
["Ҳама","📦"],
["Мошин","🚘"],
["Хона ва замин","🏠"],
["Телефон","📱"],
["Компютер","💻"],
["Электроника","📺"],
["Либос","👕"],

["Ҷойҳои корӣ","💼"],
["Хизматрасонӣ","🛠️"],
["Ҳайвонот","🐄"],
["Кӯдакон","🧸"],
["Варзиш","⚽"],
["Дигар","📦"]
];

const cities=[
"Душанбе","Хуҷанд","Бохтар","Кӯлоб",

"Панҷакент","Истаравшан","Исфара",
"Конибодом","Хоруғ","Данғара",
"Рашт","Дигар"
];

// ФИЛТРҲОИ МАХСУС

const fields={

"Мошин":[
["brand","Марка","select",[
"Toyota","Mercedes-Benz","BMW","Hyundai",
"Kia","Opel","Volkswagen","Audi","Lexus",
"Nissan","Honda","Chevrolet","BYD",
"Tesla","Ford","Mazda","VAZ","Дигар"
]],
["model","Модел","text"],
["year","Соли барориш","number"],

["fuel","Сӯзишворӣ","select",[

]],

]],

"Ҷип","Минивэн","Пикап"
]],
["color","Ранг","select",[
"Сафед","Сиёҳ","Хокистарӣ","Кабуд",
"Сурх","Сабз","Дигар"
]]
],

"Хона ва замин":[
["property","Намуди амвол","select",[
"Квартира","Хонаи шахсӣ","Замин",
"Мағоза","Офис","Дигар"
]],
["deal","Фурӯш ё иҷора","select",[
"Фурӯш","Иҷора"
]],
["rooms","Ҳуҷраҳо","select",[

]],
["area","Масоҳат (м²)","number"],
["floor","Ошёна","number"],
["totalFloors","Ҳамагӣ ошёна","number"],
["repair","Таъмир","select",[
"Нав","Евроремонт","Таъмири одӣ","Бе таъмир"
]]
],

"Телефон":[
["brand","Бренд","select",[
"Apple","Samsung","Xiaomi","Huawei",

]],
["model","Модел","text"],
["memory","Хотира","select",[
"32 GB","64 GB","128 GB","256 GB","512 GB","1 TB"
]],
["color","Ранг","text"]
]

};

function esc(v){
return String(v??"").replace(/[&<>"']/g,c=>({
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#39;"
})[c]);
}

function notice(text){
$("notice").textContent=text||"";
if(text)window.scrollTo(0,0);
}

function money(n){
return Number(n).toLocaleString("ru-RU")+" сомонӣ";
}

function photo(path){
return db.storage.from("ad-images")
.getPublicUrl(path).data.publicUrl;
}

function safeUrl(value){
try{
const u=new URL(value);
return ["http:","https:"].includes(u.protocol)?u.href:"";
}catch{return ""}
}

function show(id,navId){

clearInterval(chatTimer);
chatAd=null;
chatUser=null;

["home","post","account","chat","admin"]
.forEach(x=>$(x).classList.toggle("hidden",x!==id));

document.querySelectorAll("nav button")
.forEach(b=>b.classList.remove("active"));

if(navId)$(navId)?.classList.add("active");

notice("");
window.scrollTo(0,0);

}

function setup(){

$("categories").innerHTML=categories.map(([name,icon],i)=>`
<button class="category ${i===0?"active":""}"
onclick="selectCategory(${i})">
<span>${icon}</span>${esc(name)}
</button>
`).join("");

$("category").innerHTML=categories.slice(1)
.map(([name])=>`<option>${esc(name)}</option>`).join("");

$("city").innerHTML=cities
.map(c=>`<option>${esc(c)}</option>`).join("");

$("cityFilter").innerHTML=
'<option value="">Ҳамаи шаҳрҳо</option>'+
$("city").innerHTML;

renderPostAttributes();

}

function fieldHTML(field,prefix,values={}){

const [key,label,type,options]=field;
const value=values[key]??"";

if(type==="select"){

return `
<div>
<label>${esc(label)}</label>
<select id="${prefix}_${key}">
<option value="">Интихоб кунед</option>
${options.map(o=>`
<option value="${esc(o)}"
${String(value)===o?"selected":""}>
${esc(o)}
</option>
`).join("")}
</select>
</div>
`;

}

return `
<div>
<label>${esc(label)}</label>
<input id="${prefix}_${key}"
type="${type}"
${type==="number"?'min="0" step="1"':'maxlength="100"'}
value="${esc(value)}"
placeholder="${esc(label)}">
</div>
`;

}

function renderPostAttributes(values={}){

const list=fields[$("category").value]||[];

$("postAttributes").innerHTML=list.length?`
<div class="extraFields">
<h3>Маълумоти иловагӣ</h3>
<div class="extraGrid">
${list.map(f=>fieldHTML(f,"postExtra",values)).join("")}
</div>
</div>
`:"";

}

function getPostAttributes(){

const result={};

for(const [key,label,type] of fields[$("category").value]||[]){

const el=$("postExtra_"+key);

if(!el||!el.value.trim())continue;

if(type==="number"){

const n=Number(el.value);

if(Number.isFinite(n)&&n>=0)result[key]=n;

}else{

result[key]=el.value.trim();

}

}

return result;

}

async function loadAds(append=false){

const version=++listVersion;

$("more").disabled=true;

if(!append){
offset=0;
ads=[];
$("products").textContent="Боргирӣ...";
}

try{

let q=db.from("ads").select("*")
.eq("active",true).eq("blocked",false);

if(favoriteMode){

if(!favorites.size){
ads=[];
renderAds();
$("more").classList.add("hidden");
return;
}

q=q.in("id",[...favorites]);

}else if(selectedCategory){

q=q.eq("category",selectedCategory);

}

if($("cityFilter").value)
q=q.eq("city",$("cityFilter").value);

const search=$("search").value.trim();

if(search)q=q.ilike("title","%"+search+"%");

if($("minPrice").value!=="")
q=q.gte("price",Number($("minPrice").value));

if($("maxPrice").value!=="")
q=q.lte("price",Number($("maxPrice").value));

if(!favoriteMode)q=applyExtraFilters(q);

const sort=$("sort").value;

if(sort==="cheap")
q=q.order("price",{ascending:true});

else if(sort==="expensive")
q=q.order("price",{ascending:false});

else
q=q.order("created_at",{ascending:false});

const {data,error}=await q.order("id")
.range(offset,offset+23);

if(version!==listVersion)return;

if(error)throw error;

ads=ads.concat(data||[]);
offset+=(data||[]).length;

renderAds();

$("more").classList.toggle(
"hidden",(data||[]).length<24
);

}catch(e){

if(version===listVersion){
notice(e.message);
$("products").textContent="Эълонҳоро гирифтан нашуд.";
}

}finally{

if(version===listVersion)$("more").disabled=false;

}

}

function addFiles(input){

if(publishing)return;

for(const file of input.files){

if(selectedFiles.length+oldImages.length>=10){

notice("Танҳо 10 акс иҷозат аст.");
break;

}

if(!["image/jpeg","image/png","image/webp"]
.includes(file.type)){

notice("Танҳо JPG, PNG ва WEBP.");
continue;

}

if(file.size>5242880){

notice("Ҳар акс бояд то 5 MB бошад.");
continue;

}

selectedFiles.push(file);

}

input.value="";
renderPreview();

}

$("photos").onchange=e=>addFiles(e.target);
$("camera").onchange=e=>addFiles(e.target);

function removePhoto(type,index){

if(publishing)return;

if(type==="old")oldImages.splice(index,1);
else selectedFiles.splice(index,1);

renderPreview();

}

function renderPreview(){

previewUrls.forEach(u=>URL.revokeObjectURL(u));
previewUrls=[];

$("photoCount").textContent=
(oldImages.length+selectedFiles.length)+" / 10 акс";

$("preview").innerHTML=

oldImages.map((p,i)=>`

<div class="previewItem">
<img src="${esc(photo(p))}">
<button type="button" class="removePhoto"
onclick="removePhoto('old',${i})">✕</button>
</div>

`).join("")+

selectedFiles.map((f,i)=>{

const url=URL.createObjectURL(f);
previewUrls.push(url);

return `

<div class="previewItem">
<img src="${url}">
<button type="button" class="removePhoto"
onclick="removePhoto('new',${i})">✕</button>
</div>

`;

}).join("");

}

$("postForm").onsubmit=async e=>{

e.preventDefault();

if(!user||publishing)return;

publishing=true;

const owner=user.id;
const currentEdit=editId;
const files=[...selectedFiles];
const existing=[...oldImages];
const uploaded=[];

let saved=false;

$("publishButton").disabled=true;
$("publishButton").textContent="Сабт шуда истодааст...";

try{

if(!files.length&&!existing.length)
throw new Error("Камаш як акс илова кунед.");

if(files.length+existing.length>10)
throw new Error("Аз 10 акс зиёд мумкин нест.");

const phone=$("phone").value.replace(/[\s()-]/g,"");

if(!/^\+?\d{9,15}$/.test(phone))
throw new Error("Рақами телефон нодуруст аст.");

const values={

title:$("title").value.trim(),
category:$("category").value,
city:$("city").value,
price:Number($("price").value),
condition:$("condition").value,
phone,
description:$("description").value.trim(),
attributes:getPostAttributes()

};

if(!values.title||!values.description)
throw new Error("Ном ва тавсифро нависед.");

for(const file of files){

if(user?.id!==owner)
throw new Error("Аз нав ворид шавед.");

const ext={
"image/jpeg":"jpg",
"image/png":"png",
"image/webp":"webp"
}[file.type];

const path=owner+"/"+crypto.randomUUID()+"."+ext;

const {error}=await db.storage.from("ad-images")
.upload(path,file,{contentType:file.type});

if(error)throw error;

uploaded.push(path);

}

values.images=[...existing,...uploaded];

if(user?.id!==owner)
throw new Error("Аз нав ворид шавед.");

const result=currentEdit?

await db.from("ads").update(values)
.eq("id",currentEdit).eq("user_id",owner)
.select("id").single():

await db.from("ads")
.insert({...values,user_id:owner})
.select("id").single();

if(result.error)throw result.error;

saved=true;

selectedFiles=[];
oldImages=[];
renderPreview();

goHome();

notice("Эълони шумо бомуваффақият ҷойгир шуд!");

}catch(e){

if(!saved&&uploaded.length&&user?.id===owner){

await db.storage.from("ad-images")
.remove(uploaded);

}

notice(e.message);

}finally{

publishing=false;

$("publishButton").disabled=false;
$("publishButton").textContent=
"Ҷойгир кардани эълон — РОЙГОН";

}

};

<div id="messageList"></div>

<form id="messageForm">

<textarea id="messageInput" maxlength="2000"
placeholder="Паём нависед..." required></textarea>

<button class="full" type="submit">
Фиристодан
</button>

</form>

`;

$("messageForm").onsubmit=async e=>{

e.preventDefault();

const btn=e.target.querySelector("button");
btn.disabled=true;

const ad=chatAd;
const other=chatUser;
const uid=user?.id;

try{

const message=$("messageInput").value.trim();

if(!message||!uid)return;

const {error}=await db.from("messages").insert({

ad_id:ad,
sender_id:uid,
receiver_id:other,
message

});

if(error)throw error;

if(chatAd===ad&&chatUser===other&&$("messageInput")){

$("messageInput").value="";
await loadMessages();

}

}catch(e){

notice(e.message);

}finally{

btn.disabled=false;

}

};

loadMessages();

chatTimer=setInterval(loadMessages,5000);

}

async function loadMessages(){

if(!user||!chatAd||!$("messageList"))return;

const ad=chatAd;
const other=chatUser;
const uid=user.id;

const {data,error}=await db.from("messages")
.select("*").eq("ad_id",ad)
.or(`and(sender_id.eq.${uid},receiver_id.eq.${other}),and(sender_id.eq.${other},receiver_id.eq.${uid})`)
.order("created_at",{ascending:false})
.limit(100);

if(chatAd!==ad||chatUser!==other||
user?.id!==uid||!$("messageList"))return;

if(error){
notice(error.message);
return;
}

const list=$("messageList");

const html=(data||[]).reverse().map(m=>`

<div class="chatMessage ${m.sender_id===uid?"mine":""}">
${esc(m.message)}
<br>
<small>${esc(new Date(m.created_at).toLocaleString("ru-RU"))}</small>
</div>

`).join("");

if(list.innerHTML!==html){

list.innerHTML=html;
list.scrollTop=list.scrollHeight;

}

}

// ADMIN

async function openAdmin(){

const check=await db.rpc("is_admin");

if(check.data!==true){
notice("Дастрасӣ манъ аст.");
return;
}

show("admin","navAccount");

const {data,error}=await db.from("ads")
.select("*")
.order("created_at",{ascending:false})
.limit(200);

if(error){
notice(error.message);
return;
}

$("adminContent").innerHTML=`

<h3>Эълонҳои охирин: ${(data||[]).length}</h3>

`+(data||[]).map(a=>`

<div class="card" style="background:#f5f6fa">

<h3>${esc(a.title)}</h3>
<p>${esc(money(a.price))}</p>
<p>📍 ${esc(a.city)}</p>
<p>Телефон: ${esc(a.phone)}</p>

<button class="${a.blocked?"green":"red"}"
onclick="blockAd('${a.id}',${!a.blocked})">

${a.blocked?"Кушодани эълон":"Бастани эълон"}

</button>

</div>

`).join("");

}

async function blockAd(id,blocked){

const {error}=await db.rpc("admin_block_ad",{
p_id:id,p_blocked:blocked
});

if(error)notice(error.message);
else openAdmin();

}

// ОҒОЗИ БАРНОМА

$("search").addEventListener("keydown",e=>{
if(e.key==="Enter")loadAds();
});

$("cityFilter").onchange=()=>loadAds();
$("sort").onchange=()=>loadAds();

db.auth.onAuthStateChange((event,session)=>{

user=session?.user||null;

if(event==="PASSWORD_RECOVERY"&&session){

recoveryForm(session);

}

if(event==="SIGNED_OUT"){

clearInterval(chatTimer);
favorites.clear();

}

});

async function start(){

setup();

const {data,error}=await db.auth.getSession();

if(error)throw error;

user=data?.session?.user||null;

if(recoveryMode)return;

await refreshFavorites();

await loadAds();

loadBanners().catch(console.error);

setInterval(()=>{
loadBanners().catch(console.error);
},60000);

const ad=new URLSearchParams(location.search).get("ad");

if(ad&&/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(ad)){

openDetail(ad);

}

}

start().catch(e=>notice(e.message));

</script>
