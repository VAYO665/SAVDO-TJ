
<!DOCTYPE html>
<html lang="tg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SAVDO TJ — Бозори Тоҷикистон</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f6f8;font-family:Arial,sans-serif;color:#222}
header{background:white;position:sticky;top:0;z-index:10;box-shadow:0 2px 10px #00000010}
.top{max-width:1250px;margin:auto;padding:15px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.logo{font-size:30px;font-weight:900;color:#ff6500;cursor:pointer}
.logo span{color:#222}
button{border:0;background:#ff6500;color:white;padding:13px 18px;border-radius:12px;font-weight:bold;cursor:pointer}
button:disabled{opacity:.5;cursor:wait}
.gray{background:#eee;color:#222}
.red{background:#dc2626}
main{max-width:1250px;margin:auto;padding:18px 15px 100px}
.hero{background:linear-gradient(120deg,#ff6500,#ffad42);color:white;padding:30px;border-radius:24px;margin-bottom:20px}
.hero h1{margin:0 0 12px;font-size:30px}
.search{display:flex;background:white;padding:7px;border-radius:15px;gap:8px;margin-top:20px}
.search input{border:0;margin:0;flex:1;min-width:0}
input,select,textarea{width:100%;padding:13px;border:1px solid #ddd;border-radius:10px;font-size:15px;background:#fafafa;margin:7px 0 13px}
textarea{min-height:100px}
.categories{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:20px}
.category{background:white;padding:18px 5px;border-radius:16px;text-align:center;cursor:pointer;font-weight:bold;font-size:13px}
.category:hover,.category.active{background:#ffe4cc;color:#e65b00}
.category span{display:block;font-size:33px;margin-bottom:10px}
.filters{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.products{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}
.product{background:white;border-radius:16px;overflow:hidden;position:relative;cursor:pointer}
.product img{width:100%;height:210px;object-fit:cover;background:#eee}
.info{padding:14px}
.info h3{font-size:16px;margin:8px 0;overflow-wrap:anywhere}
.price{color:#ff6500;font-size:23px;font-weight:900}
small{color:#888}
.heart{position:absolute;top:10px;right:10px;border-radius:50%;background:white;color:#ff6500;padding:10px;font-size:20px}
.card{background:white;padding:22px;border-radius:20px;margin-bottom:15px}
.hidden{display:none!important}
.full{width:100%}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1}
.preview{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.preview img{width:100%;height:100px;object-fit:cover;border-radius:10px}
dialog{border:0;border-radius:22px;padding:20px;width:95%;max-width:650px;max-height:90vh;overflow:auto}
dialog::backdrop{background:#0009}
.close{float:right;background:#eee;color:#222}
.detailPhoto{width:100%;height:340px;object-fit:contain;background:#eee;border-radius:15px}
.thumbs{display:flex;gap:7px;overflow:auto;margin:10px 0}
.thumbs img{width:65px;height:65px;object-fit:cover;border-radius:8px;cursor:pointer}
.notice{background:#fff0df;padding:14px;border-radius:10px;margin:10px 0}
.notice:empty{display:none}
.chatMessage{background:#eee;padding:12px;border-radius:12px;margin:10px 0;overflow-wrap:anywhere;white-space:pre-wrap}
.mine{background:#ffe4cc;text-align:right}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:space-around;background:white;border-top:1px solid #ddd;padding:10px;z-index:20}
nav button{background:white;color:#444;padding:5px;font-size:12px}
nav span{display:block;font-size:23px;margin-bottom:5px}
.empty{text-align:center;padding:40px;color:#888}
@media(max-width:800px){
.categories{grid-template-columns:repeat(4,1fr)}
.products{grid-template-columns:repeat(2,1fr)}
.product img{height:170px}
.filters{grid-template-columns:repeat(2,1fr)}
.hero{padding:20px}
.hero h1{font-size:23px}
.logo{font-size:25px}
}
</style>
</head>

<body>

<header>
<div class="top">
<div class="logo" onclick="goHome()">SAVDO<span>TJ</span></div>
<div class="row">
<button onclick="openPost()">＋ Эълон</button>
<button class="gray" onclick="openAccount()">👤 Аккаунт</button>
</div>
</div>
</header>

<main>

<div id="notice" class="notice"></div>

<section id="home">

<div class="hero">
<h1>Ҳама чизро дар SAVDO TJ ёбед!</h1>
<p>Харед, фурӯшед ва эълонҳои худро ройгон ҷойгир кунед.</p>
<div class="search">
<input id="search" placeholder="Чиро ҷустуҷӯ мекунед?">
<button onclick="loadAds()">🔍</button>
</div>
</div>

<h2>Категорияҳо</h2>
<div id="categories" class="categories"></div>

<div class="filters">
<select id="cityFilter"></select>
<select id="sort">
<option value="new">Навтарин</option>
<option value="cheap">Арзонтарин</option>
<option value="expensive">Қиматтарин</option>
</select>
<input id="minPrice" type="number" min="0" placeholder="Нарх аз">
<input id="maxPrice" type="number" min="0" placeholder="Нарх то">
</div>

<button class="gray" onclick="loadAds()">Ҷустуҷӯ бо филтр</button>

<h2 id="listTitle">Эълонҳои нав</h2>
<div id="products" class="products"></div>
<button id="more" class="full gray hidden" onclick="loadMore()">Эълонҳои бештар</button>

</section>

<section id="post" class="hidden">
<div class="card">

<h2 id="postTitle">Эълони нав</h2>

<form id="postForm">

<label>Номи эълон</label>
<input id="title" maxlength="150" required>

<label>Категория</label>
<select id="category" required></select>

<label>Шаҳр</label>
<select id="city" required></select>

<label>Нарх (сомонӣ)</label>
<input id="price" type="number" min="0" step="0.01" required>

<label>Ҳолат</label>
<select id="condition">
<option>Нав</option>
<option>Истифодашуда</option>
</select>

<label>Рақами телефон</label>
<input id="phone" type="tel" placeholder="+992900000000" required>

<label>Тавсифи эълон</label>
<textarea id="description" maxlength="5000" required></textarea>

<label>Аксҳо — то 10 дона</label>

<input id="photos" type="file"
accept="image/jpeg,image/png,image/webp" multiple>

<input id="camera" type="file"
accept="image/jpeg,image/png,image/webp" capture="environment">

<div id="preview" class="preview"></div>

<button id="publishButton" class="full" type="submit">
Ҷойгир кардани эълон
</button>

</form>
</div>
</section>

<section id="account" class="hidden">
<div id="accountContent"></div>
</section>

<section id="chat" class="hidden">
<div class="card">
<h2>💬 Паёмҳо</h2>
<div id="conversations"></div>
<div id="chatContent"></div>
</div>
</section>

<section id="admin" class="hidden">
<div class="card">
<h2>🛡️ Admin</h2>
<div id="adminContent"></div>
</div>
</section>

</main>

<dialog id="detail">
<button class="close" onclick="this.parentElement.close()">✕</button>
<div id="detailContent"></div>
</dialog>

<nav>
<button onclick="goHome()"><span>🏠</span>Асосӣ</button>
<button onclick="showFavorites()"><span>❤️</span>Дӯстдошта</button>
<button onclick="openPost()"><span>➕</span>Эълон</button>
<button onclick="openChats()"><span>💬</span>Чат</button>
<button onclick="openAccount()"><span>👤</span>Аккаунт</button>
</nav>

<script>

// МАЪЛУМОТИ SUPABASE-И НАВ

const SUPABASE_URL = "SUPABASE_URL";
const SUPABASE_KEY = "SUPABASE_KEY";

const db = supabase.createClient(
 SUPABASE_URL,
 SUPABASE_KEY
);

const $ = id => document.getElementById(id);

let user = null;
let ads = [];
let favorites = new Set();
let selectedCategory = "";
let selectedFiles = [];
let oldImages = [];
let editId = null;
let favoriteMode = false;
let offset = 0;
let chatAd = null;
let chatUser = null;
let chatTimer = null;
let listVersion = 0;
let recoveryMode = false;

const categories = [
 ["Ҳама","📦"],
 ["Мошин","🚘"],
 ["Хона ва замин","🏠"],
 ["Телефон","📱"],
 ["Компютер","💻"],
 ["Электроника","📺"],
 ["Либос","👕"],
 ["Пойафзол","👟"],
 ["Мебел","🛋️"],
 ["Сохтмон","🧱"],
 ["Ҷойҳои корӣ","💼"],
 ["Хизматрасонӣ","🛠️"],
 ["Ҳайвонот","🐄"],
 ["Кӯдакон","🧸"],
 ["Варзиш","⚽"],
 ["Дигар","📦"]
];

const cities = [
 "Душанбе","Хуҷанд","Бохтар","Кӯлоб",
 "Ҳисор","Ваҳдат","Турсунзода","Панҷакент",
 "Истаравшан","Исфара","Конибодом",
 "Хоруғ","Данғара","Рашт","Дигар"
];

function esc(v){
 return String(v??"").replace(/[&<>"']/g,c=>({
 "&":"&amp;","<":"&lt;",">":"&gt;",
 '"':"&quot;","'":"&#39;"
 })[c]);
}

function notice(text){
 $("notice").textContent=text||"";
}

function show(id){
 clearInterval(chatTimer);
 ["home","post","account","chat","admin"]
 .forEach(x=>$(x).classList.toggle("hidden",x!==id));
 notice("");
 window.scrollTo(0,0);
}

function photo(path){
 if(!path)return "";
 return db.storage.from("ad-images")
 .getPublicUrl(path).data.publicUrl;
}

function money(n){
 return Number(n).toLocaleString("ru-RU")+" сомонӣ";
}

function setup(){
 $("categories").innerHTML=categories.map(([name,icon],i)=>`
 <div class="category" onclick="selectCategory(${i})">
 <span>${icon}</span>${esc(name)}
 </div>
 `).join("");

 $("category").innerHTML=categories.slice(1)
 .map(([name])=>`<option>${esc(name)}</option>`).join("");

 $("city").innerHTML=cities
 .map(c=>`<option>${esc(c)}</option>`).join("");

 $("cityFilter").innerHTML=
 '<option value="">Ҳамаи шаҳрҳо</option>'+
 $("city").innerHTML;
}

function selectCategory(i){
 selectedCategory=i?categories[i][0]:"";
 document.querySelectorAll(".category")
 .forEach((el,j)=>el.classList.toggle("active",i===j));
 favoriteMode=false;
 loadAds();
}

async function refreshFavorites(){
 favorites=new Set();
 if(!user)return;

 const {data,error}=await db.from("favorites")
 .select("ad_id").eq("user_id",user.id);

 if(!error){
 favorites=new Set((data||[]).map(x=>x.ad_id));
 }
}

async function loadAds(append=false){

 const version=++listVersion;

 if(!append){
 offset=0;
 ads=[];
 $("products").textContent="Боргирӣ...";
 }

 try{

 let q=db.from("ads").select("*")
 .eq("active",true).eq("blocked",false);

 if(favoriteMode){
 if(!favorites.size){
 $("products").innerHTML=
 '<div class="empty">Эълони дӯстдошта нест.</div>';
 $("more").classList.add("hidden");
 return;
 }
 q=q.in("id",[...favorites]);
 }

 if(selectedCategory&&!favoriteMode)
 q=q.eq("category",selectedCategory);

 const city=$("cityFilter").value;
 if(city)q=q.eq("city",city);

 const search=$("search").value.trim();
 if(search)q=q.ilike("title","%"+search+"%");

 if($("minPrice").value!=="")
 q=q.gte("price",Number($("minPrice").value));

 if($("maxPrice").value!=="")
 q=q.lte("price",Number($("maxPrice").value));

 const sort=$("sort").value;

 if(sort==="cheap")
 q=q.order("price",{ascending:true});
 else if(sort==="expensive")
 q=q.order("price",{ascending:false});
 else
 q=q.order("created_at",{ascending:false});

 const {data,error}=await q
 .order("id")
 .range(offset,offset+23);

 if(version!==listVersion)return;
 if(error)throw error;

 ads=ads.concat(data||[]);
 offset+=(data||[]).length;

 renderAds();

 $("more").classList.toggle(
 "hidden",(data||[]).length<24
 );

 }catch(e){
 notice(e.message);
 }
}

function renderAds(){

 $("listTitle").textContent=favoriteMode?
 "Эълонҳои дӯстдошта":
 selectedCategory||"Эълонҳои нав";

 $("products").innerHTML=ads.map(a=>`

 <article class="product"
 onclick="openDetail('${a.id}')">

 <button class="heart"
 onclick="event.stopPropagation();toggleFavorite('${a.id}')">
 ${favorites.has(a.id)?"♥":"♡"}
 </button>

 ${a.images?.length?
 `<img loading="lazy" src="${esc(photo(a.images[0]))}">`:
 `<div style="height:170px;background:#eee;display:grid;place-items:center;font-size:45px">📦</div>`}

 <div class="info">
 <div class="price">${esc(money(a.price))}</div>
 <h3>${esc(a.title)}</h3>
 <small>📍 ${esc(a.city)}</small>
 <p><small>${esc(a.condition)}</small></p>
 </div>

 </article>

 `).join("")||'<div class="empty">Эълон ёфт нашуд.</div>';
}

function loadMore(){
 loadAds(true);
}

function goHome(){
 favoriteMode=false;
 show("home");
 loadAds();
}

async function toggleFavorite(id){

 if(!user){
 openAccount();
 return;
 }

 let result;

 if(favorites.has(id)){
 result=await db.from("favorites").delete()
 .eq("user_id",user.id).eq("ad_id",id);

 if(!result.error)favorites.delete(id);

 }else{

 result=await db.from("favorites")
 .insert({user_id:user.id,ad_id:id});

 if(!result.error)favorites.add(id);
 }

 if(result.error){
 notice(result.error.message);
 return;
 }

 if(favoriteMode)loadAds();
 else renderAds();
}

function showFavorites(){
 if(!user){openAccount();return}
 favoriteMode=true;
 show("home");
 loadAds();
}

async function openDetail(id){

 const {data:a,error}=await db.from("ads")
 .select("*").eq("id",id).single();

 if(error){notice(error.message);return}

 const phone=String(a.phone).replace(/[^\d+]/g,"");

 $("detailContent").innerHTML=`

 <h2>${esc(a.title)}</h2>

 ${a.images?.length?
 `<img id="mainPhoto" class="detailPhoto"
 src="${esc(photo(a.images[0]))}">
 <div class="thumbs">
 ${a.images.map(p=>`
 <img src="${esc(photo(p))}"
 onclick="$('mainPhoto').src=this.src">
 `).join("")}
 </div>`:""}

 <div class="price">${esc(money(a.price))}</div>

 <p>📍 ${esc(a.city)}</p>
 <p>Категория: ${esc(a.category)}</p>
 <p>Ҳолат: ${esc(a.condition)}</p>

 <h3>Тавсиф</h3>
 <p style="white-space:pre-wrap;overflow-wrap:anywhere">${esc(a.description)}</p>

 <div class="row">

 <a style="text-decoration:none;text-align:center;background:#16a34a;color:white;padding:14px;border-radius:12px"
 href="tel:${esc(phone)}">📞 Занг задан</a>

 <button onclick="startChat('${a.id}','${a.user_id}')">
 💬 Паём
 </button>

 </div>

 <p>${esc(a.phone)}</p>

 <button class="gray full"
 onclick="shareAd('${a.id}')">
 🔗 Паҳн кардани эълон
 </button>

 `;

 if(!$("detail").open)$("detail").showModal();
}

async function shareAd(id){

 const url=new URL(location.pathname,location.origin);
 url.searchParams.set("ad",id);

 if(navigator.share){
 try{await navigator.share({url:url.href})}
 catch(e){}
 }else{
 prompt("Истиноди эълон:",url.href);
 }
}

function openPost(){

 if(!user){openAccount();return}

 editId=null;
 selectedFiles=[];
 oldImages=[];

 $("postForm").reset();
 $("postTitle").textContent="Эълони нав";

 renderPreview();
 show("post");
}

function addFiles(input){

 for(const file of input.files){

 if(selectedFiles.length+oldImages.length>=10){
 notice("Танҳо 10 акс иҷозат аст.");
 break;
 }

 if(!["image/jpeg","image/png","image/webp"].includes(file.type)){
 notice("Формати акс нодуруст аст.");
 continue;
 }

 if(file.size>5242880){
 notice("Ҳар акс бояд аз 5 MB зиёд набошад.");
 continue;
 }

 selectedFiles.push(file);
 }

 input.value="";
 renderPreview();
}

$("photos").onchange=e=>addFiles(e.target);
$("camera").onchange=e=>addFiles(e.target);

let previewUrls=[];

function renderPreview(){

 previewUrls.forEach(u=>URL.revokeObjectURL(u));
 previewUrls=[];

 $("preview").innerHTML=
 oldImages.map((p,i)=>`
 <div>
 <img src="${esc(photo(p))}">
 <button type="button" class="red full"
 onclick="oldImages.splice(${i},1);renderPreview()">✕</button>
 </div>
 `).join("")+

 selectedFiles.map((f,i)=>{

 const url=URL.createObjectURL(f);
 previewUrls.push(url);

 return `<div>
 <img src="${url}">
 <button type="button" class="red full"
 onclick="selectedFiles.splice(${i},1);renderPreview()">✕</button>
 </div>`;
 }).join("");
}

$("postForm").onsubmit=async e=>{

 e.preventDefault();

 if(!user)return;

 const owner=user.id;
 const uploaded=[];

 $("publishButton").disabled=true;

 try{

 if(!selectedFiles.length&&!oldImages.length)
 throw new Error("Камаш як акс илова кунед.");

 const phone=$("phone").value.replace(/[\s()-]/g,"");

 if(!/^\+?\d{9,15}$/.test(phone))
 throw new Error("Рақами телефонро дуруст нависед.");

 for(const file of selectedFiles){

 const ext={
 "image/jpeg":"jpg",
 "image/png":"png",
 "image/webp":"webp"
 }[file.type];

 const path=owner+"/"+crypto.randomUUID()+"."+ext;

 const {error}=await db.storage.from("ad-images")
 .upload(path,file,{contentType:file.type});

 if(error)throw error;

 uploaded.push(path);
 }

 const values={
 title:$("title").value.trim(),
 category:$("category").value,
 city:$("city").value,
 price:Number($("price").value),
 condition:$("condition").value,
 phone:phone,
 description:$("description").value.trim(),
 images:[...oldImages,...uploaded]
 };

 let result;

 if(editId){

 result=await db.from("ads")
 .update(values)
 .eq("id",editId)
 .eq("user_id",owner)
 .select("id").single();

 }else{

 result=await db.from("ads").insert({
 ...values,user_id:owner
 });

 }

 if(result.error)throw result.error;

 selectedFiles=[];
 oldImages=[];

 goHome();
 notice("Эълон бомуваффақият сабт шуд!");

 }catch(e){

 if(uploaded.length)
 await db.storage.from("ad-images").remove(uploaded);

 notice(e.message);

 }finally{
 $("publishButton").disabled=false;
 }
};

function authForm(register=false){

 $("accountContent").innerHTML=`

 <div class="card">

 <h2>${register?"Сабти ном":"Ворид шудан"}</h2>

 <form id="authForm">

 <label>Email</label>
 <input id="email" type="email" required>

 <label>Парол</label>
 <input id="password" type="password"
 ${register?'minlength="8"':''} required>

 <button class="full" type="submit">
 ${register?"Аккаунт сохтан":"Ворид шудан"}
 </button>

 </form>

 <br>

 <button class="gray full"
 onclick="authForm(${!register})">
 ${register?"Аллакай аккаунт дорам":"Сабти номи нав"}
 </button>

 <br><br>

 <button class="gray full" onclick="forgotPassword()">
 Паролро фаромӯш кардед?
 </button>

 </div>`;

 $("authForm").onsubmit=async e=>{

 e.preventDefault();

 const btn=e.target.querySelector("button");
 btn.disabled=true;

 try{

 const email=$("email").value.trim();
 const password=$("password").value;

 const result=register?
 await db.auth.signUp({
 email,password,
 options:{
 emailRedirectTo:location.origin+location.pathname
 }
 }):
 await db.auth.signInWithPassword({email,password});

 if(result.error)throw result.error;

 if(result.data.session){
 user=result.data.session.user;
 await refreshFavorites();
 openAccount();
 }else{
 notice("Email-и худро тасдиқ кунед.");
 }

 }catch(e){
 notice(e.message);
 }finally{
 btn.disabled=false;
 }
 };
}

async function forgotPassword(){

 const email=$("email")?.value.trim();

 if(!email){
 notice("Аввал Email-ро ворид кунед.");
 return;
 }

 const {error}=await db.auth.resetPasswordForEmail(
 email,{
 redirectTo:location.origin+location.pathname
 }
 );

 notice(error?error.message:
 "Агар аккаунт вуҷуд дошта бошад, Email фиристода мешавад.");
}

function recoveryForm(){

 recoveryMode=true;
 show("account");

 $("accountContent").innerHTML=`

 <div class="card">
 <h2>Пароли нав</h2>

 <form id="resetForm">

 <input id="newPassword" type="password"
 minlength="8" placeholder="Пароли нав" required>

 <input id="confirmPassword" type="password"
 minlength="8" placeholder="Такрори парол" required>

 <button class="full">Сабти пароли нав</button>

 </form>
 </div>`;

 $("resetForm").onsubmit=async e=>{

 e.preventDefault();

 const password=$("newPassword").value;

 if(password!==$("confirmPassword").value){
 notice("Паролҳо якхела нестанд.");
 return;
 }

 const {error}=await db.auth.updateUser({password});

 if(error){notice(error.message);return}

 const result=await db.auth.signOut();

 recoveryMode=false;
 user=null;

 authForm();

 notice(result.error?
 "Парол иваз шуд, аммо баромадан аз аккаунтро санҷед.":
 "Парол иваз шуд. Аз нав ворид шавед.");
 };
}

async function openAccount(){

 if(recoveryMode){recoveryForm();return}

 show("account");

 if(!user){authForm();return}

 $("accountContent").innerHTML=`

 <div class="card">
 <h2>👤 Аккаунти ман</h2>
 <p>${esc(user.email)}</p>
 <div class="row">
 <button onclick="openPost()">＋ Эълон</button>
 <button class="red" onclick="logout()">Баромадан</button>
 </div>
 <br>
 <button id="adminButton" class="hidden full"
 onclick="openAdmin()">🛡️ Admin</button>
 </div>

 <div class="card">
 <h2>Эълонҳои ман</h2>
 <div id="myAds">Боргирӣ...</div>
 </div>`;

 const {data,error}=await db.from("ads")
 .select("*").eq("user_id",user.id)
 .order("created_at",{ascending:false})
 .limit(100);

 if(!$("myAds"))return;

 if(error){notice(error.message);return}

 $("myAds").innerHTML=(data||[]).map(a=>`

 <div class="card" style="background:#f5f5f5">

 <strong>${esc(a.title)}</strong>
 <p>${esc(money(a.price))}</p>
 <small>${a.blocked?"Аз тарафи Admin баста":
 a.active?"Фаъол":"Пинҳон"}</small>

 <br><br>

 <div class="row">
 <button onclick="editAd('${a.id}')">Таҳрир</button>
 <button class="gray"
 onclick="toggleAd('${a.id}',${!a.active})">
 ${a.active?"Пинҳон":"Фаъол"}
 </button>
 <button class="red"
 onclick="deleteAd('${a.id}')">Нест кардан</button>
 </div>

 </div>

 `).join("")||"Ҳоло эълон надоред.";

 const admin=await db.rpc("is_admin");

 if($("adminButton")&&admin.data===true)
 $("adminButton").classList.remove("hidden");
}

async function editAd(id){

 const {data:a,error}=await db.from("ads")
 .select("*").eq("id",id)
 .eq("user_id",user.id).single();

 if(error){notice(error.message);return}

 openPost();

 editId=id;
 oldImages=[...(a.images||[])];

 $("postTitle").textContent="Таҳрири эълон";

 for(const key of [
 "title","category","city","price",
 "condition","phone","description"
 ]){
 $(key).value=a[key];
 }

 renderPreview();
}

async function toggleAd(id,active){

 const {error}=await db.from("ads")
 .update({active})
 .eq("id",id).eq("user_id",user.id);

 if(error)notice(error.message);
 else openAccount();
}

async function deleteAd(id){

 if(!confirm("Эълон нест карда шавад?"))return;

 const {error}=await db.from("ads").delete()
 .eq("id",id).eq("user_id",user.id);

 if(error)notice(error.message);
 else openAccount();
}

async function logout(){

 const {error}=await db.auth.signOut();

 if(error){notice(error.message);return}

 user=null;
 favorites.clear();
 openAccount();
}

async function startChat(adId,otherId){

 $("detail").close();

 if(!user){openAccount();return}

 if(user.id===otherId){
 notice("Ин эълони худи шумост.");
 return;
 }

 await openChats();

 openConversation(adId,otherId);
}

async function openChats(){

 if(!user){openAccount();return}

 show("chat");

 chatAd=null;
 chatUser=null;

 $("chatContent").innerHTML="";

 const {data,error}=await db.from("messages")
 .select("*")
 .or(`sender_id.eq.${user.id},receiver_id.eq.${user.id}`)
 .order("created_at",{ascending:false})
 .limit(300);

 if(error){notice(error.message);return}

 const seen=new Set();

 $("conversations").innerHTML=(data||[]).filter(m=>{

 const other=m.sender_id===user.id?
 m.receiver_id:m.sender_id;

 const key=m.ad_id+other;

 if(seen.has(key))return false;
 seen.add(key);
 return true;

 }).map(m=>{

 const other=m.sender_id===user.id?
 m.receiver_id:m.sender_id;

 return `<button class="gray full"
 style="margin-bottom:8px"
 onclick="openConversation('${m.ad_id}','${other}')">
 💬 ${esc(m.message.slice(0,65))}
 </button>`;

 }).join("")||"Ҳоло паём надоред.";
}

function openConversation(adId,otherId){

 clearInterval(chatTimer);

 chatAd=adId;
 chatUser=otherId;

 $("chatContent").innerHTML=`

 <hr>
 <div id="messageList"></div>

 <form id="messageForm">
 <textarea id="messageInput" maxlength="2000"
 placeholder="Паём нависед..." required></textarea>
 <button class="full">Фиристодан</button>
 </form>`;

 $("messageForm").onsubmit=async e=>{

 e.preventDefault();

 const btn=e.target.querySelector("button");
 btn.disabled=true;

 try{

 const message=$("messageInput").value.trim();
 if(!message)return;

 const {error}=await db.from("messages").insert({
 ad_id:chatAd,
 sender_id:user.id,
 receiver_id:chatUser,
 message
 });

 if(error)throw error;

 $("messageInput").value="";
 await loadMessages();

 }catch(e){
 notice(e.message);
 }finally{
 btn.disabled=false;
 }
 };

 loadMessages();
 chatTimer=setInterval(loadMessages,5000);
}

async function loadMessages(){

 if(!user||!chatAd||!$("messageList"))return;

 const ad=chatAd;
 const other=chatUser;

 const {data,error}=await db.from("messages")
 .select("*")
 .eq("ad_id",ad)
 .or(`and(sender_id.eq.${user.id},receiver_id.eq.${other}),and(sender_id.eq.${other},receiver_id.eq.${user.id})`)
 .order("created_at",{ascending:false})
 .limit(100);

 if(chatAd!==ad||chatUser!==other||!$("messageList"))return;

 if(error){notice(error.message);return}

 $("messageList").innerHTML=(data||[]).reverse().map(m=>`

 <div class="chatMessage ${m.sender_id===user.id?"mine":""}">
 ${esc(m.message)}
 </div>

 `).join("");
}

async function openAdmin(){

 const check=await db.rpc("is_admin");

 if(check.data!==true){
 notice("Дастрасӣ манъ аст.");
 return;
 }

 show("admin");

 const {data,error}=await db.from("ads")
 .select("*")
 .order("created_at",{ascending:false})
 .limit(200);

 if(error){notice(error.message);return}

 $("adminContent").innerHTML=(data||[]).map(a=>`

 <div class="card" style="background:#f5f5f5">

 <strong>${esc(a.title)}</strong>
 <p>${esc(money(a.price))}</p>
 <p>${esc(a.city)}</p>

 <button class="${a.blocked?"":"red"}"
 onclick="blockAd('${a.id}',${!a.blocked})">
 ${a.blocked?"Кушодани эълон":"Бастани эълон"}
 </button>

 </div>

 `).join("");
}

async function blockAd(id,blocked){

 const {error}=await db.rpc("admin_block_ad",{
 p_id:id,p_blocked:blocked
 });

 if(error)notice(error.message);
 else openAdmin();
}

$("search").addEventListener("keydown",e=>{
 if(e.key==="Enter")loadAds();
});

async function start(){

 setup();

 db.auth.onAuthStateChange((event,session)=>{

 user=session?.user||null;

 if(event==="PASSWORD_RECOVERY"){
 recoveryMode=true;
 recoveryForm();
 }

 });

 const {data,error}=await db.auth.getSession();

 if(error)notice(error.message);

 user=data?.session?.user||null;

 if(recoveryMode)return;

 await refreshFavorites();
 await loadAds();

 const ad=new URLSearchParams(location.search).get("ad");

 if(ad&&/^[0-9a-f-]{36}$/i.test(ad)){
 openDetail(ad);
 }
}

start().catch(e=>notice(e.message));

</script>

</body>
</html>
